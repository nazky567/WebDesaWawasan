name: Deploy Sistem Informasi Desa Wawasan to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zvfpfydczquikevunvnc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2ZnBmeWRjenF1aWtldnVudm5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MDgyNDIsImV4cCI6MjEwMTQ4NDI0Mn0.GoOIqfITOeaK8Hb_4ULVBpF7b-FyLV5VC0QSNwOe-bw' }}
          VITE_CHATBASE_CHATBOT_ID: ${{ secrets.VITE_CHATBASE_CHATBOT_ID || 'tJe9tB1UKZBesihEf06sz' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
